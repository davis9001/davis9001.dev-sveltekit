<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link
			rel="icon"
			type="image/png"
			href="%sveltekit.assets%/favicon-dark.png"
			media="(prefers-color-scheme: dark)"
		/>
		<link
			rel="icon"
			type="image/png"
			href="%sveltekit.assets%/favicon-light.png"
			media="(prefers-color-scheme: light)"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="apple-mobile-web-app-title" content="davis9001" />
		<meta name="author" content="David Monaghan" />
		<meta name="theme-color" content="#09090b" />
		<script>
			// Prevent FOUC by setting theme immediately
			(function () {
				// URL param overrides for headless PDF generation (?dark or ?light)
				var params = new URLSearchParams(location.search);
				if (params.has('dark')) {
					document.documentElement.setAttribute('data-theme', 'dark');
					return;
				}
				if (params.has('light')) {
					document.documentElement.setAttribute('data-theme', 'light');
					return;
				}

				var stored = localStorage.getItem('theme-preference');
				var theme = 'light';

				if (stored === 'light' || stored === 'dark') {
					theme = stored;
				} else if (stored === 'system' || !stored) {
					// Use system preference
					if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
						theme = 'dark';
					}
				}

				document.documentElement.setAttribute('data-theme', theme);
			})();
		</script>
		<!-- Google tag (gtag.js) - production hostnames only -->
		<script>
			(function () {
				// Exact match only. The dev tunnel is a subdomain of the production
				// domain (dev-<hash>.davis9001.dev), so a suffix test would let it through.
				var PRODUCTION_HOSTS = ['davis9001.dev', 'www.davis9001.dev'];
				if (PRODUCTION_HOSTS.indexOf(location.hostname) === -1) return;

				var MEASUREMENT_ID = 'G-CGCVGMFE98';
				var loader = document.createElement('script');
				loader.async = true;
				loader.src = 'https://www.googletagmanager.com/gtag/js?id=' + MEASUREMENT_ID;
				document.head.appendChild(loader);

				window.dataLayer = window.dataLayer || [];
				window.gtag = function () {
					window.dataLayer.push(arguments);
				};
				window.gtag('js', new Date());
				window.gtag('config', MEASUREMENT_ID);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
