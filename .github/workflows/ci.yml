name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  BUN_VERSION: '1.3.14'

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Run unit tests with coverage
        run: bun run test:coverage

      - name: Check coverage threshold (95%)
        run: |
          set -euo pipefail
          SUMMARY=coverage/coverage-summary.json
          # Fail loudly if the report is missing. The previous version piped a
          # missing file into jq, which left COVERAGE empty and made the
          # comparison silently succeed — the gate passed no matter what.
          if [ ! -f "$SUMMARY" ]; then
            echo "::error::$SUMMARY not found — check the vitest coverage reporters"
            exit 1
          fi
          status=0
          for metric in statements branches functions lines; do
            pct=$(jq -r ".total.${metric}.pct" "$SUMMARY")
            echo "$metric: $pct%"
            if ! awk -v p="$pct" 'BEGIN { exit (p >= 95) ? 0 : 1 }'; then
              echo "::error::$metric coverage is $pct%, below the 95% floor"
              status=1
            fi
          done
          exit $status

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage
          fail_ci_if_error: false

  # Build & Deploy handled by Cloudflare Pages Git integration
  # See: https://dash.cloudflare.com → Pages → davis9001.dev
